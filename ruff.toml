# The scripts in this directory are the gates. `validate_manifest` decides
# whether `stack.toml` and the resolved Compose model agree, `check_images`
# decides whether every pinned image runs on a Raspberry Pi, and `check_forms`
# decides whether a form is a project somebody can start. Nothing read them.
#
# Most of them carry a `--self-test` that drives their judgements against
# replies they did not fetch, which is the harder half. This is the easy half
# and it was missing: a name that does not exist, an `except` that swallows what
# it was meant to report, an import left behind by a rewrite.
#
# Byte-for-byte the settings lemonfiber/spec holds its own gate scripts to, for
# the same reason it holds them: a mistake in the thing that enforces
# correctness is the one mistake nothing else will catch.
target-version = "py312"

line-length = 110

[lint]
# The floor, and the reasoning for each rule, live in
# `lemonfiber/spec`'s `shared/ruff.toml`, which `check_shared_files.py` holds
# this copy to: every rule below has to stay selected, and nothing may be
# added to `ignore` that the shared file does not already ignore.
select = ["E", "W", "F", "B", "I", "SIM", "UP", "RUF", "EXE", "FURB", "ISC"]

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

[format]
docstring-code-format = true
