# Caddy reverse-proxy overlay (profile: proxy). Off by default. Provides friendly
# hostnames with real certificates. Scaffold.
services:
  caddy:
    image: caddy:2.8.4
    profiles: [proxy]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
