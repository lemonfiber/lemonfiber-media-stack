# Shared service defaults.
#
# This file is deliberately NOT in compose.yml's include list. It is reached only
# through `extends:`, so `defaults`, `rootless` and `confined` are templates —
# they never become containers, and they never appear in `docker compose ps`.
#
# Paths here read `compose/_common.yml` rather than `_common.yml` because every
# include sets `project_directory: .`, making all relative paths root-relative.

services:
  # Everything gets these two. A container that stops for any reason other than
  # an explicit `docker compose down` comes back.
  defaults:
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Amsterdam}

  # Images that drop privileges from a PUID/PGID pair — LinuxServer.io, hotio,
  # Homepage, Calibre-Web-Automated. Setting these on an image that ignores them
  # would be a silent no-op that reads like a security control, so services whose
  # upstream doesn't document them extend `defaults` and set `user:` instead.
  rootless:
    extends:
      service: defaults
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

  # lemonfiber's own images, each of which holds a credential that administers
  # another service (C6-R20, C6-R22). A read-only root; the operator's uid, who
  # owns the configuration directory lemonfiber writes into, rather than root or
  # the image's own non-root user, who owns nothing on the host; every kernel
  # capability dropped; no privilege gained after start; and a memory limit.
  # scripts/validate_manifest.py holds every service of lemonfiber's own to all
  # of it, and to the networks its ADR names.
  confined:
    extends:
      service: defaults
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
