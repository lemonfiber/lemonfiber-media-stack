# Profile: proxy — friendly hostnames. Off unless `--profile proxy` is given.
#
# Layers onto any other form: `docker compose --profile full --profile proxy up`.
# Caddy is the supported route to real certificates for these hostnames. For a
# name no public authority issues a certificate for, it serves plain HTTP rather
# than a certificate a browser warns about. Its Jellyfin route goes to the door,
# which serves TLS of its own on 8920 (compose/media.yml).

services:
  caddy:
    extends:
      file: compose/_common.yml
      service: defaults
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    profiles: [proxy]
    environment:
      # config/caddy/Caddyfile reads this. Without it every site address
      # collapses to a bare suffix and Caddy refuses to start.
      DOMAIN: ${DOMAIN:-home.local}
    ports:
      - "${LAN_BIND:-0.0.0.0}:80:80"
      - "${LAN_BIND:-0.0.0.0}:443:443"
    # `requests` is how it reaches Seerr, which is on no other network it shares,
    # and `door` is how it reaches Jellyfin, from the one address the door trusts
    # to say which client a request came from.
    networks:
      default: {}
      requests: {}
      door:
        ipv4_address: 10.80.96.3
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own certificate and configuration stores, unrelated to
      # ${DATA_ROOT}. Losing caddy_data means re-issuing every certificate.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
