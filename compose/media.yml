# Profile: media — serving what you have.
#
# The household tier: these publish on ${LAN_BIND} rather than loopback, because
# a library nobody can reach from the TV is not a library. Homepage (dash) and
# Caddy (proxy) publish there too — `bind = "lan"` in stack.toml is the list of
# record. Set LAN_BIND in .env to pin them to one interface address rather than
# all of them.

services:
  jellyfin:
    extends:
      file: compose/_common.yml
      service: defaults
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    profiles: [media]
    # The official image takes a uid:gid pair rather than PUID/PGID.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports: ["${LAN_BIND:-0.0.0.0}:8096:8096"]
    volumes:
      # One mount, like everything else. Jellyfin writes artwork and NFO files
      # back into the library by default, so this is deliberately not read-only.
      - ${DATA_ROOT:-./data}:/data
      - ./config/jellyfin:/config
      - ./config/jellyfin/cache:/cache
    # Hardware transcoding: uncomment both lines and set RENDER_GID in .env to
    # the host's render group id (`getent group render`). Intel/AMD VA-API.
    # devices: ["/dev/dri:/dev/dri"]
    # group_add: ["${RENDER_GID:-0}"]

  seerr:
    extends:
      file: compose/_common.yml
      service: defaults
    image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    profiles: [media]
    # The image bakes in `node:node` and documents no PUID pair. That fixed uid
    # owns nothing on the host, so its bind-mounted config is unwritable on
    # Linux unless the operator happens to share it — which is why this runs as
    # the operator instead. config/seerr/ is shipped for the same reason: Docker
    # would otherwise create it as root and no non-root user could write it.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
    ports: ["${LAN_BIND:-0.0.0.0}:5055:5055"]
    volumes:
      - ./config/seerr:/app/config
    # No data mount: it takes requests and calls APIs, it never reads the library.

  calibre-web-automated:
    extends:
      file: compose/_common.yml
      service: rootless
    image: crocodilestick/calibre-web-automated:V3.1.4@sha256:577e846f104fd21453ef306eefb4a95dd95b3b9ddd2463a150944494284da0fd
    profiles: [media]
    ports: ["${LAN_BIND:-0.0.0.0}:8083:8083"]
    volumes:
      # Point the Calibre library at /data/media/books on first run. Acquisition
      # is Bindery's job, so the image's separate ingest folder goes unused — a
      # second mount beneath the data root is not available to us.
      - ${DATA_ROOT:-./data}:/data
      - ./config/calibre-web-automated:/config

  audiobookshelf:
    extends:
      file: compose/_common.yml
      service: defaults
    image: ghcr.io/advplyr/audiobookshelf:2.36.1@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
    profiles: [media]
    # The container serves on 80; 13378 is the conventional host port.
    ports: ["${LAN_BIND:-0.0.0.0}:13378:80"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/audiobookshelf:/config
      - ./config/audiobookshelf/metadata:/metadata

  navidrome:
    extends:
      file: compose/_common.yml
      service: defaults
    image: ghcr.io/navidrome/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    profiles: [media]
    # No PUID/PGID pair is documented: the image takes a uid:gid instead, and
    # runs as root when given neither. config/navidrome/ is shipped for the same
    # reason Jellyfin's is — Docker would create the missing bind-mount source as
    # root:root, and this process, which is not root, could not then write the
    # database it keeps there.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Both of these default to a path this project already uses for something
      # else — ND_DATAFOLDER's own default is /data, which here is the library —
      # so naming them is what keeps the one-mount rule from being broken by a
      # default nobody wrote down.
      ND_MUSICFOLDER: /data/media/music
      ND_DATAFOLDER: /config
      # On by default upstream: an anonymous report about this machine, every
      # 24 hours, to Navidrome's own endpoint. Nothing here sends anything the
      # operator did not ask for. The metadata agents stay on and stack.toml
      # says what they fetch.
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
    ports: ["${LAN_BIND:-0.0.0.0}:4533:4533"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/navidrome:/config
