# Profile: subs — subtitle automation.

services:
  bazarr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls367@sha256:c1673816321156b904af9b7e6415ea547ae9622e4acc375358f1e1eb9ed1e904
    profiles: [subs]
    ports: ["127.0.0.1:6767:6767"]
    volumes:
      # Read-write: subtitles are written next to the media they belong to.
      - ${DATA_ROOT:-./data}:/data
      - ./config/bazarr:/config
