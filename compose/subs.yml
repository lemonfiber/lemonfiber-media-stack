# Profile: subs — subtitle automation.

services:
  bazarr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/bazarr:1.6.1@sha256:762f802274598da27255b2e5778f262b2b71b355a23e3812d9ee1520f8dbe37c
    profiles: [subs]
    ports: ["127.0.0.1:6767:6767"]
    volumes:
      # Read-write: subtitles are written next to the media they belong to.
      - ${DATA_ROOT:-./data}:/data
      - ./config/bazarr:/config
