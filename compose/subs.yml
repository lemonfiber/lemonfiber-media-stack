# Profile: subs — subtitle automation.

services:
  bazarr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/bazarr:1.6.2@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
    profiles: [subs]
    ports: ["127.0.0.1:6767:6767"]
    volumes:
      # Read-write: subtitles are written next to the media they belong to.
      - ${DATA_ROOT:-./data}:/data
      - ./config/bazarr:/config
