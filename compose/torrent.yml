# Profile: torrent — torrent downloading, VPN-isolated.
#
# Gluetun is the only service in the stack holding NET_ADMIN, and qBittorrent
# has no network namespace of its own: it borrows Gluetun's. If the tunnel drops,
# qBittorrent loses connectivity rather than falling back to the home IP. This is
# the single permitted cross-service dependency, legal because both services
# share the `torrent` profile.

services:
  gluetun:
    extends:
      file: compose/_common.yml
      service: defaults
    image: qmcgaw/gluetun:v3.40.0
    profiles: [torrent]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    ports:
      - "127.0.0.1:8081:8081" # qBittorrent UI, published on gluetun's namespace
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:?set VPN_PROVIDER in .env}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set in .env}
      SERVER_COUNTRIES: ${VPN_COUNTRIES:-Netherlands}
      # Port forwarding: only some providers support it — ProtonVPN, PIA,
      # PrivateVPN, Perfect Privacy. Off for NordVPN, Mullvad and the rest,
      # where the port machinery simply does not run.
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      VPN_PORT_FORWARDING_PROVIDER: ${VPN_PROVIDER}
      # Push the dynamic forwarded port into qBittorrent on acquire AND release.
      # The down command is not optional: without it qBittorrent keeps the stale
      # port and will not re-acquire correctly after a reconnect.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -qO- --post-data
        "json={\"listen_port\":{{PORT}}}"
        http://127.0.0.1:8081/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -qO- --post-data
        "json={\"listen_port\":0}"
        http://127.0.0.1:8081/api/v2/app/setPreferences'

  qbittorrent:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    profiles: [torrent]
    environment:
      WEBUI_PORT: 8081
    network_mode: "service:gluetun" # all traffic through the tunnel
    depends_on:
      gluetun:
        # Health-gated, not process-gated: the tunnel must be established before
        # any peer traffic is possible, or the first seconds leak.
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/qbittorrent:/config
