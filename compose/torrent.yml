# Profile: torrent — torrent downloading, VPN-isolated.
#
# Gluetun is the only service in the stack holding NET_ADMIN, and qBittorrent
# has no network namespace of its own: it borrows Gluetun's. If the tunnel drops,
# qBittorrent loses connectivity rather than falling back to the home IP. This is
# the single permitted cross-service dependency, legal because both services
# share the `torrent` profile.

services:
  gluetun:
    extends:
      file: compose/_common.yml
      service: defaults
    image: qmcgaw/gluetun:v3.40.0
    profiles: [torrent]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    ports:
      - "127.0.0.1:8081:8081" # qBittorrent UI, published on gluetun's namespace
    environment:
      # Deliberately not `${VPN_PROVIDER:?...}`. Compose interpolates the whole
      # project before it filters by profile, so a required-variable guard here
      # becomes a required variable for every form — someone running only
      # `search` or `library` would be made to supply VPN credentials for a
      # tunnel they never start. Gluetun validates both itself and refuses to
      # come up without them, which is where that error belongs.
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:-}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      SERVER_COUNTRIES: ${VPN_COUNTRIES:-Netherlands}
      # Port forwarding: only some providers support it — ProtonVPN, PIA,
      # PrivateVPN, Perfect Privacy. Off for NordVPN, Mullvad and the rest,
      # where the port machinery simply does not run.
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      VPN_PORT_FORWARDING_PROVIDER: ${VPN_PROVIDER:-}
      # Asking for a forwarded port is not the same as landing on a server that
      # can grant one. Tied to the same switch so the two cannot disagree:
      # otherwise the tunnel comes up on a server that cannot forward, and the
      # only symptom is a port that never arrives.
      PORT_FORWARD_ONLY: ${VPN_PORT_FORWARDING:-off}
      # qBittorrent's WebUI API answers 403 without a session, so the push logs
      # in first. Credentials come from the operator's .env; with none set the
      # script says the port was not pushed rather than failing quietly.
      QBT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      # Push the forwarded port on acquire AND release. The down command is not
      # optional: qBittorrent left holding a port the provider has taken back
      # does not re-acquire correctly on the next reconnect.
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh /gluetun/push-port.sh {{PORT}}
      VPN_PORT_FORWARDING_DOWN_COMMAND: /bin/sh /gluetun/push-port.sh 0
    volumes:
      - ./scripts/push-port.sh:/gluetun/push-port.sh:ro

  qbittorrent:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    profiles: [torrent]
    environment:
      WEBUI_PORT: 8081
    network_mode: "service:gluetun" # all traffic through the tunnel
    depends_on:
      gluetun:
        # Health-gated, not process-gated: the tunnel must be established before
        # any peer traffic is possible, or the first seconds leak.
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/qbittorrent:/config
