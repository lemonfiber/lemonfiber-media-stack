# Profile: tv — television automation.

services:
  sonarr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls327@sha256:dffc730adcb8b4f4342792fbb27fcad9c62fb8660523f2aeb082416980d7fe0c
    profiles: [tv]
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/sonarr:/config
    # `gate-upstream` is how the request gate reaches it for Seerr.
    networks: [default, gate-upstream]
