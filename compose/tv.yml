# Profile: tv — television automation.

services:
  sonarr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/sonarr:4.0.15
    profiles: [tv]
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/sonarr:/config
