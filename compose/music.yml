# Profile: music — music automation.
#
# Lidarr is the slowest-moving service in the stack — roughly eight months
# between releases. Not archived, still functional, and no viable successor
# exists, so it is retained and watched.

services:
  lidarr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/lidarr:2.14.5@sha256:5e1235d00b5d1c1f60ca0d472e554a6611aef41aa7b5b6d88260214bf4809af0
    profiles: [music]
    ports: ["127.0.0.1:8686:8686"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/lidarr:/config
