# Profile: search — finding things.
# Admin tier: everything here publishes on loopback only.

services:
  prowlarr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163@sha256:f9151e5bc1025c6d0a630d503210cdcb6bb55a7cc098562609d96a408d838902
    profiles: [search]
    ports: ["127.0.0.1:9696:9696"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/prowlarr:/config

  flaresolverr:
    extends:
      file: compose/_common.yml
      service: defaults
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    profiles: [search]
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    ports: ["127.0.0.1:8191:8191"]
    # No data mount: it solves browser challenges, it never touches the library.

  nzbhydra2:
    extends:
      file: compose/_common.yml
      service: rootless
    image: lscr.io/linuxserver/nzbhydra2:v8.9.0-ls104@sha256:3cdcea6fc97861bb30ef2551884f1c371e08a884c2f75230c7a3a2e14c5f0516
    profiles: [search]
    ports: ["127.0.0.1:5076:5076"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/nzbhydra2:/config
