# Profile: books — book and audiobook automation.
#
# Bindery is not a Servarr application: Prowlarr's app sync does not reach it,
# so its indexers are wired as Torznab endpoints during seeding.

services:
  bindery:
    extends:
      file: compose/_common.yml
      # Not `rootless`: the image is distroless and reads no PUID pair, so
      # setting those two would be a silent no-op that reads like a control.
      service: defaults
    image: ghcr.io/vavallee/bindery:v1.37.0@sha256:704995e9286097c9ac6caedab6e3f45628a5c107ff13e5313404e987d757295a
    profiles: [books]
    # What the image does read is the uid Docker starts it as, and its own is
    # 65532 — a user owning nothing on the host, so both mounts are unwritable
    # on Linux. Running it as the operator is what makes the data root writable
    # *and* keeps what it imports owned like everything else the stack writes.
    # config/bindery/ is shipped for the other half: Docker creates a missing
    # bind-mount source as root, and nothing here runs as root to fix it after.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Bindery defaults these to /books and /downloads, which are not on the
      # single data mount — imports would land inside the container and vanish
      # with it. Audiobook paths inherit from these when unset.
      # Taken verbatim on the service's *first* start, and ignored on every start
      # after — it generates its own otherwise and keeps it in a database, where
      # nothing outside the container could present it. So this is minted before the
      # service has ever run rather than while seeding, which happens after it is up.
      BINDERY_API_KEY: ${BINDERY_API_KEY:-}
      BINDERY_LIBRARY_DIR: /data/media/books
      BINDERY_AUDIOBOOK_DIR: /data/media/audiobooks
      BINDERY_DOWNLOAD_DIR: /data/downloads
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ./config/bindery:/config
