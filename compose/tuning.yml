# Profile: tuning — quality profiles and extraction.
#
# Neither service has a web interface, so neither publishes a port. They reach
# the *arrs over the network by URL, which is not a `depends_on` and so does not
# cross a profile boundary — the tuning profile boots on its own and simply has
# nothing to talk to until an *arr is up.

services:
  recyclarr:
    extends:
      file: compose/_common.yml
      service: defaults
    image: ghcr.io/recyclarr/recyclarr:7.4.0
    profiles: [tuning]
    # Upstream documents a uid:gid pair rather than PUID/PGID.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      CRON_SCHEDULE: ${RECYCLARR_CRON:-@daily}
      # config/recyclarr/recyclarr.yml reads these through `!env_var`. They are
      # empty until the stack is seeded; until then each cycle logs an
      # authentication failure and changes nothing, which is the inert state.
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
    volumes:
      - ./config/recyclarr:/config
    # No data mount: it edits quality profiles over the API, not files on disk.

  unpackerr:
    extends:
      file: compose/_common.yml
      service: rootless
    image: ghcr.io/hotio/unpackerr:release-0.14.5
    profiles: [tuning]
    environment:
      UMASK: ${UMASK:-002}
      # Where each *arr is, which this file already knows, and the key seeding
      # published for it. The key names on the right are lemonfiber's own —
      # one per service, read from wherever that service keeps it — and the
      # mapping to what this image calls them lives here, so a service added
      # later is a line of Compose rather than a line of anybody's code.
      #
      # Unpackerr skips any *arr whose key is unset, so an unseeded stack idles
      # rather than erroring.
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY:-}
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY:-}
      UN_LIDARR_0_URL: http://lidarr:8686
      UN_LIDARR_0_API_KEY: ${LIDARR_API_KEY:-}
    volumes:
      # It extracts archives in place in the download directory.
      - ${DATA_ROOT:-./data}:/data
      - ./config/unpackerr:/config
