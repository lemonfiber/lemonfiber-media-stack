# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56).
name: ci
on:
  pull_request:
  # What a merge queue asks, and the only event it asks it on. A queued pull
  # request is applied to `main`'s tip, with everything ahead of it, on a
  # temporary `gh-readonly-queue/main/...` branch, and every context `main`
  # requires has to report there. One that does not is read as a wait, and the
  # queue drops the pull request at the timeout with nothing naming the cause.
  #
  # It carries no pull request: `github.event.pull_request` is null here. A job
  # reading it is handed nothing, and a job that then skips reports success,
  # which is how a queue merges a batch nothing tested. So every job below that
  # produces a required context runs here, and the shared workflows read the
  # merge group's own range; the two that exist only for a pull request say
  # so in their condition.
  merge_group:
permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  # Labels describe a pull request, and a merge group is not one. Not required,
  # so skipping it on a merge group leaves no context waiting.
  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
  # OPS-R39, OPS-R40 and OPS-R42: label a PR that advances the staged version,
  # put it in that version's milestone, comment which goals it moves, and route
  # one that cites only out-of-scope requirements to the next version. The
  # reusable workflow has existed for some time and this repository never called
  # it, so none of those three rules has ever run anywhere.
  #
  # It matters here as much as in the binary's repository: `0.15.0` names this
  # repository in `satisfied_in`, so a pull request against it can be the one
  # that advances a goal.
  #
  # `issues: write` is what the milestone half needs: a milestone is an
  # issues-API object even when it sits on a pull request, and granting less
  # gets the label and a warning instead.
  #
  # Pull requests only, for the labeler's reason: a goal, a milestone and a
  # comment belong to a pull request, and this context is not required.
  goals:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: lemonfiber/spec/.github/workflows/goal-automations.yml@9ea0d953458bb79b9afd8b412d7e99c9435cff34 # v1.0.46
