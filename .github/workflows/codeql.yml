# CodeQL static analysis. This repo has no compiled application code, so we
# analyse the GitHub Actions workflows themselves for injection and
# supply-chain flaws — the SAST surface that actually exists here. Q-R53.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  # A merge queue asks for `analyze` and `alerts / alerts` again on its own
  # branch, and a context that never reports there is a wait the queue ends by
  # dropping the pull request. The analysis runs over the merged batch, and
  # `alerts` asks about this run's own ref, which on this event is the queue's
  # branch.
  merge_group:
  schedule:
    - cron: "0 6 * * 2"
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          # Named, because GitHub builds the category from the *matrix* and there
          # is none here: a single-language job with no `category:` is recorded
          # as `.github/workflows/codeql.yml:analyze`, with no language in it at
          # all. The gate below compares what was analysed against what this file
          # says is meant to be, and a category naming no language answers for no
          # language.
          category: "/language:actions"

  # The analysis finding something is not the same as anything stopping it. The
  # check GitHub raises beside it compares the configurations a pull request
  # produced against every one seen on `main`, and the supply-chain scan uploads
  # three that only ever run on `main` — so it is neutral on every pull request,
  # whatever the analysis found, and gates nothing. This asks the question that
  # was meant: is there an open alert against what this branch proposes.
  #
  # `!cancelled()` rather than `always()`, and rather than `needs:` alone: a
  # `needs:` dependency that fails makes this job vanish, and a skipped required
  # check satisfies branch protection — so the one gate that refuses an alert
  # would be absent in exactly the case where the analysis went wrong. A
  # cancelled run is somebody pressing stop, and finishing the job they stopped
  # serves nobody. The gate refuses a commit it has no analysis of, by language
  # and by name, so running it after a failed analysis says what is missing
  # rather than passing on an empty list.
  alerts:
    needs: analyze
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: read
    uses: lemonfiber/spec/.github/workflows/codeql-alerts.yml@578850cd7cc9c81ed1664ce7885c9b93aeeab564 # v1.0.23
    with:
      analysis: ${{ needs.analyze.result }}
