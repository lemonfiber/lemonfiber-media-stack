# Gate media-stack PRs on zero new SonarCloud issues. The scan is SonarCloud
# Automatic Analysis; this enforces the standard the free-plan gate cannot
# (Q-R64) via the shared reusable in spec, so every repo gates identically.
name: sonar
on:
  pull_request:
  # A merge queue asks for `gate / gate` again on its own branch, and a context
  # that never reports there is a wait the queue ends by dropping the pull
  # request. The shared gate runs on this event rather than skipping: it reads
  # the new-issue count of every pull request in the batch and the open count
  # against the project, and refuses what it cannot read. `SonarCloud Code
  # Analysis` is not required on `main`, because the app that posts it never
  # posts on a queue's branch; this gate is what holds Q-R64.
  merge_group:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16
    with:
      # Named, because the default is <owner>_<repo> and this project is not called
      # that. `lemonfiber_lemonfiber-media-stack` resolves to nothing, and a key that
      # resolves to nothing answers every count with zero — so the half of the gate
      # that watches the open-issue total has never once been enforced here.
      project: lemonfiber_media-stack
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
