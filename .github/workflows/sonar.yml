# Gate media-stack PRs on zero new SonarCloud issues. The scan is SonarCloud
# Automatic Analysis; this enforces the standard the free-plan gate cannot
# (Q-R64) via the shared reusable in spec, so every repo gates identically.
name: sonar
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@0dda512352aea96a486df3933ae08354993ef67c # main
    with:
      # Named, because the default is <owner>_<repo> and this project is not called
      # that. `lemonfiber_lemonfiber-media-stack` resolves to nothing, and a key that
      # resolves to nothing answers every count with zero — so the half of the gate
      # that watches the open-issue total has never once been enforced here.
      project: lemonfiber_media-stack
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
