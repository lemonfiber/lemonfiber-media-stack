# The maintainer queue flag. Triggers are declared here because a reusable
# cannot declare its caller's; the behaviour lives in the spec repo. OPS-R26, OPS-R27.
#
# The list below is also the wait list. The flag only goes up once every check
# `main` requires has passed, and the reusable reads this same list back out of
# this file to know what it must see finish first — so a workflow missing from it
# is a workflow the gate never waits for and never re-evaluates on. `main`
# requires twenty-one checks here and they come from four workflows:
#
#   ci        spec-check / spec-check, dco / dco, attribution / attribution,
#             commitlint / commitlint, workflow-pins / workflow-pins,
#             hygiene / {actionlint, invite, links, markdown, pins,
#             shared-files, typos},
#             security / {gitleaks, osv-scanner}
#   sonar     gate / gate
#   codeql    analyze, alerts / alerts
#   validate  stack, images, runnable, the stack starts
#
# `SonarCloud Code Analysis` is not required. The SonarCloud app posts it rather
# than a workflow, and never on a merge queue's branch, so `main` requires
# `gate / gate` in its place, which is what holds Q-R64.
#
# All four also run on `merge_group`, and those runs reach this gate too. The
# reusable asks which pull request the head commit belongs to; a merge group's
# belongs to none, and it says so and stops.
#
# Add a workflow to branch protection and it belongs here in the same change.
name: awaiting-maintainer
on:
  # `codeql` is in this list because of what its `alerts` job now does. The list
  # is what re-asks the question when a workflow finishes; a gating workflow left
  # out of it can be the last one to go green, with nothing afterwards to notice
  # that the pull request became mergeable. The flag then never goes up and
  # nothing says why.
  #
  # `validate` is here because four of the required checks come from it.
  workflow_run:
    workflows: [ci, sonar, codeql, validate]
    types: [completed]
  pull_request_review:
    types: [submitted]
  # Fork PRs carry a read-only token under `pull_request`, so the close event has
  # to run in the base repo's context to be able to edit a label at all.
  pull_request_target:
    types: [closed]
permissions:
  contents: read

jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@f7ef911f4276d09240148d0c5ff5a18d9534497d # v1.0.15
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
