# Pin one of lemonfiber's own images at the tag the release train published.
#
# `lemonfiber-<service>`'s release workflow dispatches this once it has published
# `ghcr.io/lemonfiber/<service>:<tag>`, with the index digest it recorded
# (ADR-0033 §4). `image_bump.py` checks the pin against `stack.toml` and the
# registry and writes it; this puts the change on a branch, signed, and opens or
# updates its pull request. Its checks are the ones every pin meets. The core
# then takes the stack through its submodule, and the train's second run checks
# that the embedded stack pins each image at that tag and digest.
name: image-bump

on:
  workflow_dispatch:
    inputs:
      service:
        description: "The service id in stack.toml, e.g. decline."
        required: true
      tag:
        description: "The tag the train published, vX.Y.Z or vX.Y.Z-<identifier>."
        required: true
      digest:
        description: "The index digest that tag published, sha256:<64 hex>."
        required: true

permissions:
  contents: read

concurrency:
  # One pin per service at a time; two runs would each move the branch under
  # the other.
  group: image-bump-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # `main` requires signed commits and only commits GitHub makes are signed,
      # and a pull request opened with `GITHUB_TOKEN` triggers no workflows. Both
      # want an app token.
      - name: Mint a token that can open a pull request here
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Move the pin
        id: move
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          # Held to their shapes before they reach a command line or a ref;
          # `image_bump.py` holds them again, with the reason in words. Matched
          # in the shell rather than piped to `grep -q`, which can exit before
          # its producer finishes and read a match as none under pipefail.
          [[ "$SERVICE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] \
            || { echo "::error::'${SERVICE}' is not a service id"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
            || { echo "::error::'${TAG}' is not a tag the train cuts"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::'${DIGEST}' is not a sha256 digest"; exit 1; }
          python3 scripts/image_bump.py --self-test
          # Outside the checkout, so the commit below cannot carry it.
          python3 scripts/image_bump.py --apply "$SERVICE" "$TAG" "$DIGEST" > "$RUNNER_TEMP/applied.json"
          cat "$RUNNER_TEMP/applied.json"
          if git diff --quiet; then
            echo "moved=no" >> "$GITHUB_OUTPUT"
            echo "::notice::${SERVICE} is already pinned at ${TAG}, ${DIGEST}."
            exit 0
          fi
          echo "moved=yes" >> "$GITHUB_OUTPUT"

      # The same offline gate the pull request will meet.
      - name: The manifest and the compose model still agree
        if: steps.move.outputs.moved == 'yes'
        run: python3 scripts/validate_manifest.py

      - name: Put the change on the branch, signed, and open or update its pull request
        if: steps.move.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SERVICE: ${{ inputs.service }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="chore/image-${SERVICE}"
          staging="${branch}-staging"
          # The commit the files were read from: the change carries whole files,
          # and laid onto a later `main` they would undo what landed between.
          base="$(git rev-parse HEAD)"

          # Built on a scratch ref and moved across in one step, so the pull
          # request's branch never holds no commits, which would close it.
          if gh api "repos/${REPO}/git/ref/heads/${staging}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${staging}" \
              -F sha="${base}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${staging}" -f sha="${base}" >/dev/null
          fi

          python3 - "$REPO" "$staging" "$base" "$RUNNER_TEMP" <<'PY' > "$RUNNER_TEMP/request.json"
          import base64
          import json
          import subprocess
          import sys

          repo, branch, base, scratch = sys.argv[1:5]
          applied = json.load(open(f"{scratch}/applied.json"))
          move = applied["moves"][0]
          was, now = move["from"], move["to"]
          headline = f"chore(pins): {move['id']} {was['tag']} -> {now['tag']}"
          said = (
              f"The release train published {move['image']}:{now['tag']}, and its index "
              f"is {now['digest']} (ADR-0033 §4)."
          )
          reviewed = [f"Pin-reviewed: {sid}" for sid in applied["reviewed"]]
          changed = subprocess.run(
              ["git", "diff", "--name-only"], capture_output=True, text=True, check=True
          ).stdout.split()
          body = "\n".join([
              said,
              "",
              *reviewed,
              "Spec: E1-R1, F2-R14",
              "",
              "Signed-off-by: lemonfiber release <release@lemonfiber.app>",
          ])
          print(json.dumps({
              "query": (
                  "mutation($input: CreateCommitOnBranchInput!) "
                  "{ createCommitOnBranch(input: $input) { commit { oid } } }"
              ),
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": repo, "branchName": branch},
                  "expectedHeadOid": base,
                  "message": {"headline": headline, "body": body},
                  "fileChanges": {"additions": [
                      {"path": name, "contents": base64.b64encode(open(name, "rb").read()).decode()}
                      for name in changed
                  ]},
              }},
          }))
          with open(f"{scratch}/headline.txt", "w") as handle:
              handle.write(headline)
          with open(f"{scratch}/body.md", "w") as handle:
              handle.write(body.replace("Signed-off-by: lemonfiber release <release@lemonfiber.app>", "").rstrip())
              handle.write("\n\nOpened by `image-bump`, which the image's own release dispatches.\n")
          PY

          built="$(gh api graphql --input "$RUNNER_TEMP/request.json" --jq '.data.createCommitOnBranch.commit.oid')"
          if ! printf '%s' "$built" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the commit was not created; got '${built}'"
            exit 1
          fi

          if gh api "repos/${REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${branch}" \
              -F sha="${built}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="${built}" >/dev/null
          fi
          gh api --method DELETE "repos/${REPO}/git/refs/heads/${staging}" >/dev/null 2>&1 || true

          headline="$(cat "$RUNNER_TEMP/headline.txt")"
          existing="$(gh pr list --repo "${REPO}" --head "${branch}" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$existing" ]; then
            gh pr edit "${existing}" --repo "${REPO}" --title "${headline}" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            echo "::notice::#${existing} updated"
          else
            created="$(gh pr create --repo "${REPO}" --head "${branch}" --base main \
              --title "${headline}" --body-file "$RUNNER_TEMP/body.md" --label dependencies)"
            existing="${created##*/}"
            echo "::notice::opened #${existing}"
          fi

          gh pr merge "${existing}" --repo "${REPO}" --auto \
            && echo "auto-merge armed on #${existing}" \
            || echo "::warning::could not arm auto-merge on #${existing}; it waits for a maintainer."
