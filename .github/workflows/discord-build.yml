# Post each run's outcome that the public #build-log channel carries (OPS-R24):
# every run for main, a tag, a release, a schedule or a dispatch, and every pull
# request run that failed. The notifier decides which before a runner starts.
# workflow_run executes in the base repo with the org secret available and never
# in fork-PR code; values reach the reusable as inputs, not shell interpolations.
name: discord-build
on:
  workflow_run:
    workflows: [gates, codeql, validate, sonar, scorecard]
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    uses: lemonfiber/spec/.github/workflows/discord-notify.yml@aadea4182b9f9fa7082fbfd2eeae3f955584c3a1 # v1.0.64
    with:
      title: "${{ github.event.workflow_run.name }} · ${{ github.event.workflow_run.head_branch }}"
      body: "${{ github.event.repository.name }} — ${{ github.event.workflow_run.conclusion }} · ${{ github.event.workflow_run.head_sha }}"
      url: ${{ github.event.workflow_run.html_url }}
      color: ${{ github.event.workflow_run.conclusion == 'success' && '3066993' || '15158332' }}
      build-log: true
    secrets:
      webhook: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
