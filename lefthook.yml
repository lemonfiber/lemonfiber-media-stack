# Local hooks mirroring CI.
#
# The networked image check (`just images`) is deliberately absent: a commit
# should not depend on a registry being reachable. CI runs it.
pre-commit:
  commands:
    # Parity covers both sides, so any change to either triggers it.
    stack:
      glob: "{stack.toml,compose.yml,compose/*.yml,stacks/*.yml}"
      run: python3 scripts/validate_manifest.py && python3 scripts/check_forms.py
    validator-tests:
      glob: "scripts/*.py"
      run: python3 scripts/test_validate_manifest.py
    typos:
      run: typos
