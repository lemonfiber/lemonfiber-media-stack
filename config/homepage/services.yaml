# Homepage services.
#
# Two different URLs per entry, and the difference matters:
#
#   href    where your browser goes. Admin services are bound to loopback, so
#           their links only resolve on the machine running the stack.
#           Household services use ${HOMEPAGE_VAR_LAN_HOST} so a phone on the
#           sofa reaches them too.
#   widget  where Homepage itself goes, over the Compose network by service
#           name and container port.
#
# API keys arrive as HOMEPAGE_VAR_* environment variables and are empty until
# the stack is seeded. A widget with no key simply shows no data; it does not
# break the page. Never paste a key into this file — it is committed.
#
# A group whose services aren't in the running form just shows them as down.
# That is correct: the form is the statement of what should be running.

- Watch:
    - Jellyfin:
        icon: jellyfin.png
        href: http://{{HOMEPAGE_VAR_LAN_HOST}}:8096
        description: Films and television
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"

    - Seerr:
        icon: overseerr.png
        href: http://{{HOMEPAGE_VAR_LAN_HOST}}:5055
        description: Ask for something
        widget:
          type: overseerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

