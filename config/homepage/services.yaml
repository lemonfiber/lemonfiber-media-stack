    - qBittorrent:
        icon: qbittorrent.png
        href: http://localhost:8081
        # Reached through Gluetun: qBittorrent has no network namespace of its
        # own, so on the Compose network it answers on the tunnel's name.
        description: Torrents, via the VPN
        widget:
          type: qbittorrent
          url: http://gluetun:8081
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USER}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASS}}"
