# lemonfiber media-stack. Runs with plain `docker compose` — no lemonfiber binary
# needed. One fragment per profile, stitched together here; forms are composed by
# activating profile sets, e.g.
#
#     docker compose --profile search --profile usenet --profile tv up -d
#
# See stack.toml for the manifest lemonfiber consumes. The two are held in parity
# by scripts/validate_manifest.py — every service in one is in the other.
#
# THE ONE RULE: every service that touches the library gets exactly one
# ${DATA_ROOT}:/data mount. Downloads and media are subdirectories beneath it, on
# one filesystem, so imports hardlink instead of copy. Splitting them into
# separate mounts silently turns every import into a copy.
#
# BINDING: admin services publish on 127.0.0.1; household services publish on
# ${LAN_BIND} so a TV or a phone can reach them.
#
# `project_directory: .` on every entry is load-bearing, not boilerplate: without
# it, a fragment's relative paths resolve against compose/ instead of the project
# root, and `./config/sonarr` becomes `compose/config/sonarr`. With it, every
# relative path in every fragment is root-relative — one rule, no exceptions.
#
# Omitting it is caught rather than tolerated: the fragment's `extends:` path
# rebases too, so Compose cannot find compose/_common.yml and builds no model at
# all. The mount-source check in scripts/validate_manifest.py is the backstop for
# any fragment that has no extends to break first.

include:
  - path: compose/search.yml
    project_directory: .
  - path: compose/usenet.yml
    project_directory: .
  - path: compose/torrent.yml
    project_directory: .
  - path: compose/tv.yml
    project_directory: .
  - path: compose/movies.yml
    project_directory: .
  - path: compose/music.yml
    project_directory: .
  - path: compose/books.yml
    project_directory: .
  - path: compose/subs.yml
    project_directory: .
  - path: compose/media.yml
    project_directory: .
  - path: compose/tuning.yml
    project_directory: .
  - path: compose/dash.yml
    project_directory: .
  - path: compose/proxy.yml
    project_directory: .
