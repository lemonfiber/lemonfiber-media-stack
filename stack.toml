# The stack manifest — the contract between media-stack and cli.
# Schema: https://github.com/lemonfiber/spec/blob/main/20-architecture/contracts/stack-manifest.md
# Every field here is consumed by lemonfiber; adding a service is a data change.

schema_version  = 1
stack_version   = "0.1.0"
min_cli_version = "0.1.0"

# ─────────────────────────── Profiles (one per service's role) ───────────────
[[profile]]
id = "search"
name = "Indexers"
description = "Finding things"

[[profile]]
id = "usenet"
name = "Usenet"
description = "Usenet downloading"
protocol = "usenet"

[[profile]]
id = "torrent"
name = "Torrents"
description = "Torrent downloading, VPN-isolated"
protocol = "torrent"

[[profile]]
id = "tv"
name = "Television"
description = "TV automation"

[[profile]]
id = "movies"
name = "Movies"
description = "Film automation"

[[profile]]
id = "music"
name = "Music"
description = "Music automation"

[[profile]]
id = "books"
name = "Books"
description = "Book and audiobook automation"

[[profile]]
id = "subs"
name = "Subtitles"
description = "Subtitle automation"

[[profile]]
id = "media"
name = "Library"
description = "Serving what you have"

[[profile]]
id = "tuning"
name = "Tuning"
description = "Quality profiles and extraction"

[[profile]]
id = "dash"
name = "Dashboard"
description = "A page linking everything"

[[profile]]
id = "proxy"
name = "Proxy"
description = "Friendly hostnames"

# ─────────────────────────── Forms (named slices) ────────────────────────────
[[form]]
id = "search"
name = "Search"
description = "Find things. Nothing else runs."
profiles = ["search"]

[[form]]
id = "dl"
name = "Download"
description = "You have a link — fetch it."
profiles = ["usenet", "torrent"]

[[form]]
id = "hunt"
name = "Hunt"
description = "Search and grab, manually."
profiles = ["search", "usenet", "torrent"]

[[form]]
id = "tv"
name = "TV"
description = "Search, download and automate television"
profiles = ["search", "usenet", "torrent", "tv", "subs"]

[[form]]
id = "movies"
name = "Movies"
description = "Search, download and automate film"
profiles = ["search", "usenet", "torrent", "movies", "subs"]

[[form]]
id = "music"
name = "Music"
description = "Search, download and automate music"
profiles = ["search", "usenet", "torrent", "music"]

[[form]]
id = "books"
name = "Books"
description = "Search, download and automate books and audiobooks"
profiles = ["search", "usenet", "torrent", "books"]

[[form]]
id = "auto"
name = "Auto"
description = "Everything automated, nothing served"
profiles = ["search", "usenet", "torrent", "tv", "movies", "music", "books", "subs", "tuning"]

[[form]]
id = "library"
name = "Library"
description = "Serve what exists. Requires no third-party accounts."
profiles = ["media"]

[[form]]
id = "full"
name = "Full"
description = "The lot."
profiles = ["search", "usenet", "torrent", "tv", "movies", "music", "books", "subs", "media", "tuning", "dash"]

[[form]]
id = "proxy"
name = "Proxy"
description = "Friendly hostnames. Layers onto any other form."
profiles = ["proxy"]

# ─────────────────────────── Services (20) ───────────────────────────────────
[[service]]
id = "prowlarr"
name = "Prowlarr"
profile = "search"
image = "lscr.io/linuxserver/prowlarr"
tag = "2.5.2"
port = 9696
bind = "loopback"
criticality = "core"
memory_mib = 200
license = "GPL-3.0-only"
upstream = "https://github.com/Prowlarr/Prowlarr"
last_release = "2026-07-22"
describes = "Holds your indexer accounts in one place and shares them with everything else"
without_it = "Every app needs indexers configured separately"
reaches = "the indexers you configured"
asks_for = "Runs the searches everything else asks for, and reads each indexer's capabilities and remaining allowance, authenticating with the keys you gave it."
provides = ["indexer.search"]
health = { kind = "http", path = "/ping", timeout_s = 60 }
api = { kind = "servarr", key_source = "config-xml", path = "/config/config.xml", version = 1 }

