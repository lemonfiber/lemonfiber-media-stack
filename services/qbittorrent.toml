[[service]]
id = "qbittorrent"
name = "qBittorrent"
profile = "torrent"
image = "lscr.io/linuxserver/qbittorrent"
tag = "5.2.4"
digest = "sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983"
port = 8081
bind = "loopback"
criticality = "core"
memory_mib = 200
license = "GPL-2.0-only"
upstream = "https://github.com/qbittorrent/qBittorrent"
last_release = "2026-09-28"
describes = "Downloads the torrents everything else asks for"
without_it = "No torrent downloads"
reaches = "trackers and peers, through the tunnel"
asks_for = "Announces to a torrent's trackers and exchanges data with peers, which is what a torrent client is; all of it inside gluetun's network, so it stops when the tunnel does."
depends_on = ["gluetun"]
provides = ["download.torrent"]
health = { kind = "http", path = "/api/v2/app/version", timeout_s = 60 }
api = { kind = "qbittorrent", key_source = "generated" }
listens = 8081

[[service.claim]]
capability = "download.torrent"

[[service.claim.probe]]
id = "guarded"
request = { method = "GET", path = "/api/v2/torrents/info" }
expect = { status = 403 }
fixture = "recordings/qbittorrent/download-torrent-guarded.json"

[[service.claim.probe]]
id = "queue"
request = { method = "GET", path = "/api/v2/torrents/info" }
expect = { status = 200, json_array_min = 0 }
fixture = "recordings/qbittorrent/download-torrent-queue.json"
